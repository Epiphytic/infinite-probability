[package]
name = "infinite-probability-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["epiphytic"]
description = "Core library and CLI for Infinite Probability plugin marketplace - AISP (AI Structured Protocol) conversion with Claude SDK fallback"
license = "MIT"
repository = "https://github.com/epiphytic/infinite-probability"
homepage = "https://github.com/epiphytic/infinite-probability"
documentation = "https://docs.rs/infinite-probability-core"
readme = "../README.md"
keywords = ["aisp", "ai", "claude", "llm", "conversion"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
publish = true

[lib]
name = "infinite_probability_core"
path = "src/lib.rs"

[[bin]]
name = "infinite-probability"
path = "src/main.rs"

[dependencies]
# AISP conversion with LLM fallback
rosetta-aisp = "0.1"
rosetta-aisp-llm = "0.1"
aisp = { version = "0.1", features = ["serde"] }

# Async runtime
tokio = { version = "1.49", features = ["full", "signal"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
directories = "5.0"

[dev-dependencies]
tempfile = "3.9"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conversion"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["cli"]
cli = []
